schema_version: 0.1.0
id: SH-HS-MATH-HJ-B2-C08-L03-A01
version: 0.1.0
status: draft
resource_type: applet
title: 数乘伸缩实验室
subtitle: 拖动原向量并连续调节实数 λ，观察同向、零向量和反向边界
curriculum:
  region: 上海
  stage: 高中
  subject: 数学
  edition: 沪教版
  volume_id: B2
  volume_title: 必修第二册
  chapter_id: SH-HS-MATH-HJ-B2-C08
  chapter_title: 平面向量
  section_id: SH-HS-MATH-HJ-B2-C08-S01
  section_title: 向量的概念和线性运算
  lesson_id: SH-HS-MATH-HJ-B2-C08-L03
  textbook_ref: 8.1.3
  lesson_title: 实数与向量的乘法
pedagogy:
  cognitive_action: 缩放
  estimated_classroom_minutes: 12
  primary_teaching_problem: 学生容易只记长度变为 |λ| 倍，忽略 λ 的符号决定方向，并在 λ = 0 时误说仍有方向。
  learning_goals:
    - 通过拖动原向量 a，观察数乘规律不依赖某一幅固定图。
    - 通过连续调节 λ，区分 λ > 0、λ = 0、λ < 0 对方向和长度的几何含义。
    - 说明 |λa| = |λ||a|，并把 λ 的符号和方向关系联系起来。
    - 在 λ = 0 或 a 为零向量时，指出 λa 为零向量且方向不规定。
  prerequisites:
    - 向量的大小、方向、相反向量和零向量
    - 有向线段可以表示一个平面向量
    - 实数倍、比例和线段伸缩经验
  successors:
    - SH-HS-MATH-HJ-B2-C08-L04
    - SH-HS-MATH-HJ-B2-C08-L06
    - SH-HS-MATH-HJ-B2-C08-L08
  core_competencies:
    - 直观想象
    - 数学抽象
    - 数学运算
mathematical_scope:
  focus: 在同一起点显示原向量 a 与 λa，用拖拽和 λ 滑块动态呈现同向伸缩、零向量边界和反向伸缩。
  lesson: 实数与向量的乘法
  scalar_rule: "|λa| = |λ||a|"
  direction_rule:
    positive_lambda: λ > 0 时 λa 与 a 同向，长度变为 λ 倍。
    zero_lambda: λ = 0 时 λa 为零向量，长度为 0，方向不规定。
    negative_lambda: λ < 0 时 λa 与 a 方向相反，长度变为 |λ| 倍。
  zero_vector_rule: 若 a 为零向量，则任意 λ 下 λa 仍为零向量，方向不规定。
  default_state:
    base_vector: a = (2.4, 1.4) as a visual displacement on the grid
    lambda: 1.5
  out_of_scope:
    - 向量加法、减法和混合运算训练
    - 8.3 向量坐标表示的课时边界讨论
    - 用坐标公式系统训练共线和平行判定
    - 超出 draft / self_checked_draft / metadata_ready 草稿边界的正式流转
representations:
  - id: reference_grid
    role: 浅色参照网格只帮助观察方向和长度伸缩，不显示 x/y 标签，也不作为 8.3 坐标运算训练。
  - id: base_vector
    role: 蓝色有向线段表示原向量 a，可拖动端点改变大小和方向。
  - id: scaled_vector
    role: 橙色有向线段表示 λa，与 a 共起点以突出同向、反向和零向量边界。
  - id: lambda_control
    role: 用滑块和快速按钮连续切换 λ 的正、零、负和分数倍。
  - id: sign_cases
    role: 同屏区分 λ > 0、λ = 0、λ < 0 三种几何含义。
interaction_design:
  primary_control: 拖动蓝色原向量 a 的箭头端点，并调节实数 λ 滑块。
  teacher_controls:
    - 重置到默认向量和默认 λ
    - 按观察 a、调节 λ、看边界、归纳四步揭示
    - 快速切换 λ = -1、-0.5、0、0.5、1、2
  student_controls:
    - 拖动原向量 a，比较不同方向下 λa 的响应
    - 调节 λ 从正数穿过 0 到负数，观察方向和长度变化
    - 在 λ = 0、λ = -1 和分数倍处记录几何解释
  staged_reveal:
    - step: observe_base_vector
      description: 先只读出原向量 a 的大小和方向，避免学生直接套公式。
    - step: vary_scalar
      description: 连续调节 λ，观察同向伸缩和长度倍率。
    - step: inspect_boundaries
      description: 停在 λ = 0 与 λ < 0，强调零向量边界和反向。
    - step: summarize_rule
      description: 归纳 λ 的符号决定方向，|λ| 决定长度倍率。
data_contract:
  state_variables:
    - name: lambda
      value_type: number
      default: 1.5
      description: 当前实数倍数 λ。
      persistence: snapshot
    - name: base_vector
      value_type: point2d
      description: 原向量 a 的可视化位移端点。
      persistence: snapshot
    - name: scaled_vector
      value_type: point2d
      description: λa 的可视化位移端点，由 λ 与 a 联动得到。
      persistence: snapshot
    - name: lambda_sign
      value_type: string
      default: positive
      description: 当前 λ 所在的三种情形之一：positive、zero、negative。
      persistence: snapshot
    - name: direction_relation
      value_type: string
      default: 同向
      description: λa 与 a 的方向关系；零向量情形为不规定。
      persistence: snapshot
    - name: reveal_step
      value_type: number
      default: 1
      description: 当前教师分步揭示阶段。
      persistence: snapshot
  events:
    - name: ready
      direction: applet_to_player
      description: 课件完成初始渲染。
      payload:
        - lambda
        - base_vector
        - scaled_vector
        - lambda_sign
        - direction_relation
        - reveal_step
      required_for_player: true
    - name: state_changed
      direction: applet_to_player
      description: 拖动原向量、调节 λ、快速切换 λ 或切换揭示阶段时通知播放器。
      payload:
        - lambda
        - base_vector
        - scaled_vector
        - lambda_sign
        - direction_relation
        - reveal_step
      required_for_player: true
feedback_and_diagnosis:
  success_evidence:
    - 学生能说清 λ > 0 时 λa 与 a 同向，长度为 λ 倍。
    - 学生能说清 λ = 0 时 λa 为零向量，长度为 0，方向不规定。
    - 学生能说清 λ < 0 时 λa 与 a 反向，长度为 |λ| 倍。
    - 学生能拖动 a 后仍用同一规则解释 λa 的方向和长度。
  common_error_tags:
    - id: sign_direction_confusion
      label: 忽略 λ 的符号，只记长度倍率
    - id: zero_vector_direction_error
      label: 误给 λ = 0 时的零向量指定方向
    - id: absolute_value_length_gap
      label: 把长度倍率误写成 λ 而不是 |λ|
    - id: representation_gap
      label: 几何伸缩、符号 λa 和语言解释断裂
  feedback_principles:
    - 先让学生指向图上同向、反向或零向量证据，再写符号结论。
    - 纠正负倍数误区时停在 λ = -1，与相反向量建立联系。
    - 纠正零向量误区时停在 λ = 0，单独强调长度和方向边界。
    - 纠正公式机械记忆时拖动 a，检验规律是否保持。
visual_semantics:
  base_vector: 蓝色表示原向量 a。
  scaled_vector: 橙色表示数乘后的 λa。
  guide_lines: 灰色虚线表示 a 所在直线的正向和反向。
  sign_cards: 青绿色、灰色和红色分别强调正、零、负三种 λ 情形。
  rule: 颜色只承载数学对象和状态含义，不作为装饰。
implementation:
  phase: runnable_prototype
  html_src_status: runnable
  planned_engine: native-canvas-svg
  create_src_in_later_task: false
  classroom_device_targets:
    - desktop
    - tablet
    - projector
files:
  readme: README.md
  teacher_script: teacher-script.md
  student_task: student-task.md
  review_record: review.md
  src_entry: src/index.html
compliance:
  copyright_note: 本资源为原创交互草稿，不复制教材正文、官方课件、教案或商业题库；第 8 章教材来源和课时边界仍需纸质教材或已登录平台终核，当前仅保持 draft / self_checked_draft / metadata_ready 草稿边界。
  review_status: self_checked_draft
