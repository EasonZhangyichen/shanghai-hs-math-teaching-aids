schema_version: 0.1.0
id: SH-HS-MATH-HJ-B2-C08-L10-A01
version: 0.1.0
status: draft
resource_type: applet
title: 向量法路径比较板
subtitle: 比较几何路径如何转化为同一个向量等式
curriculum:
  region: 上海
  stage: 高中
  subject: 数学
  edition: 沪教版
  volume_id: B2
  volume_title: 必修第二册
  chapter_id: SH-HS-MATH-HJ-B2-C08
  chapter_title: 平面向量
  section_id: SH-HS-MATH-HJ-B2-C08-S04
  section_title: 向量的应用
  lesson_id: SH-HS-MATH-HJ-B2-C08-L10
  textbook_ref: "8.4"
  lesson_title: 向量的应用
pedagogy:
  cognitive_action: 分解
  estimated_classroom_minutes: 16
  primary_teaching_problem: 学生面对几何题时常急于套公式，缺少先判断基底法、路径法、数量积/坐标法哪一种适合作为第一步的策略。
  learning_goals:
    - 说清 8.4 向量应用调用的前置知识来自 8.1 线性运算、8.2 数量积和 8.3 坐标表示。
    - 围绕同一个三角形分点问题，比较基底法、路径法、数量积/坐标法的第一步建模选择。
    - 在三角形情境中选择一组基向量，并用从 A 出发的向量 AD、AE 表示边上分点。
    - 比较 D 到 E 的三条几何路径，说明路径不同但向量和相同。
    - 把 AD/AB、AE/AC 这样的几何关系转化为系数形式的向量等式，但不展开完整解题器。
  prerequisites:
    - "8.1 向量的概念和线性运算：有向线段、相等向量、向量加减法和数乘的几何意义"
    - "8.2 向量的数量积：知道数量积适合处理长度、夹角和垂直判断"
    - "8.3 向量的坐标表示：知道坐标法适合数值化表示点、向量和运算"
    - "平面几何中的三角形边、分点、中点、平行和垂直关系"
  successors:
    - SH-HS-MATH-HJ-B2-C09-K01
    - SH-HS-MATH-HJ-XB1-SPACEVEC-K01
    - SH-HS-MATH-HJ-XB1-ANALYTIC-K01
  core_competencies:
    - 直观想象
    - 逻辑推理
    - 数学运算
    - 数学建模
mathematical_scope:
  focus: 以三角形 ABC 中 D 在 AB 上、E 在 AC 上为典型情境，比较向量应用题的第一步建模选择。
  lesson: 向量的应用
  problem_model: "设 D 在 AB 上，AD/AB = m；E 在 AC 上，AE/AC = n。目标是判断第一步应如何建模，并把向量 DE 写成选定基向量的线性组合。"
  primary_basis: "p 表示向量 AB，q 表示向量 AC；以 A 为共同起点，AD = m p，AE = n q，DE = AE - AD = -m p + n q。"
  alternate_basis: "p 表示向量 AB，r 表示向量 BC；此时 AC = p + r，AD = m p，AE = n(p + r)，DE = AE - AD = (n - m)p + n r。"
  first_step_methods:
    - "基底法：先选 p = AB、q = AC，因为 D、E 都落在从 A 出发的两条边上。"
    - "路径法：先选 D -> A -> E、D -> B -> C -> E 或 D -> B -> E，把每段移动翻译为向量和。"
    - "数量积/坐标法：先判断是否要求长度、夹角、垂直或数值坐标；本题只求 DE 的表达时暂不作为起手。"
  compared_paths:
    - "D -> A -> E：先回到共同基点 A，再到 E。"
    - "D -> B -> C -> E：沿已知边绕行，用边向量验证同一结果。"
    - "D -> B -> E：先到已知顶点 B，再表达 BE。"
  out_of_scope:
    - 不做通用几何题库或完整证明批改器
    - 不进入 8.3 坐标法的系统训练
    - 不把数量积/坐标法扩展成全能向量应用工具箱
    - 不强行展开复杂解析几何或坐标建系计算
    - 不处理数量积求角、求长度的完整应用链
representations:
  - id: geometry_board
    role: 显示三角形 ABC、分点 D/E、所选基向量和当前路径。
  - id: basis_selector
    role: 比较 AB/AC 与 AB/BC 两种基向量选择对等式表达的影响。
  - id: first_step_strategy
    role: 明确比较基底法、路径法、数量积/坐标法的第一步建模选择。
  - id: path_trace
    role: 高亮 D 到 E 的不同路径，并把每一段对应到向量和。
  - id: equation_readout
    role: 同步显示题设关系、路径等式和化简后的目标向量。
  - id: strategy_panel
    role: 帮助教师把“选基向量、选路径、化简比较”作为课堂策略总结。
interaction_design:
  primary_control: 拖动 D、E 或使用比例滑块改变 m = AD/AB 与 n = AE/AC，观察不同路径等式如何同步变化。
  teacher_controls:
    - 重置到默认分点
    - 切换基底法、路径法、数量积/坐标法的第一步提示
    - 切换基向量组
    - 切换三条路径
    - 按题设、选基、选路径、化简比较四步揭示
    - 使用典型分点预设控制课堂节奏
  student_controls:
    - 先选择一种第一步建模方法并说明理由
    - 拖动 D 点改变 m
    - 拖动 E 点改变 n
    - 选择不同路径并记录对应的向量等式
    - 比较不同路径化简后是否得到同一个向量
  staged_reveal:
    - step: read_conditions
      description: 先读 D、E 的分点关系，只确定 m 和 n，不急于计算。
    - step: choose_basis
      description: 比较基底法、路径法、数量积/坐标法的第一步，再选择基向量写 AD、AE 的向量表达，避免把点 D、E 直接等同于向量。
    - step: trace_path
      description: 选择 D 到 E 的一条路径，把每段几何移动翻译成向量和。
    - step: compare_equations
      description: 化简并比较不同路径，归纳“路径可变，向量和不变”的策略。
data_contract:
  state_variables:
    - name: ratio_m
      value_type: number
      default: 0.4
      description: D 在 AB 上的位置比例，m = AD/AB。
      persistence: snapshot
    - name: ratio_n
      value_type: number
      default: 0.65
      description: E 在 AC 上的位置比例，n = AE/AC。
      persistence: snapshot
    - name: basis_mode
      value_type: string
      default: ab_ac
      description: 当前基向量组，ab_ac 表示 AB/AC，ab_bc 表示 AB/BC。
      persistence: snapshot
    - name: first_step_choice
      value_type: string
      default: basis
      description: 当前第一步建模选择，basis、path 或 metric。
      persistence: snapshot
    - name: route_id
      value_type: string
      default: via_a
      description: 当前比较路径，via_a、via_edges 或 via_b。
      persistence: snapshot
    - name: basis_equation
      value_type: string
      description: 当前基向量选择下 AD、AE 与 DE 的表达。
      persistence: snapshot
    - name: path_delta
      value_type: string
      description: 当前路径对应的向量和及其化简结果。
      persistence: snapshot
    - name: reveal_step
      value_type: number
      default: 1
      description: 当前教师分步揭示阶段。
      persistence: snapshot
  events:
    - name: ready
      direction: applet_to_player
      description: 课件完成初始渲染。
      payload:
        - ratio_m
        - ratio_n
        - basis_mode
        - first_step_choice
        - route_id
        - basis_equation
        - path_delta
        - reveal_step
      required_for_player: true
    - name: state_changed
      direction: applet_to_player
      description: 拖动分点、切换基向量、切换路径或切换揭示阶段时通知播放器。
      payload:
        - ratio_m
        - ratio_n
        - basis_mode
        - first_step_choice
        - route_id
        - basis_equation
        - path_delta
        - reveal_step
      required_for_player: true
    - name: path_selected
      direction: applet_to_player
      description: 教师或学生选择新的路径时单独记录路径比较动作。
      payload:
        - route_id
        - basis_mode
        - path_delta
      required_for_player: true
feedback_and_diagnosis:
  success_evidence:
    - 学生能说出 8.4 本题调用了 8.1 线性运算、8.2 数量积和 8.3 坐标表示中的哪些工具，但不混成一个万能工具箱。
    - 学生能比较基底法、路径法、数量积/坐标法的第一步选择，并说明本题为什么优先用基底法或路径法。
    - 学生能先写出选定基向量，再写 AD、AE 的向量表达；若口头使用“D 点对应 mp、E 点对应 nq”的位置向量简写，需说明共同起点为 A。
    - 学生能解释 D -> A -> E、D -> B -> C -> E 等不同路径化简后为什么一致。
    - 学生能把“点在边上”的几何语言转化为 AD = m p、AE = n q 等向量等式。
    - 学生能说明坐标法可以作为后续工具，但本题第一步更适合先用路径分解。
  common_error_tags:
    - id: basis_not_chosen
      label: 未先选定基向量就开始写式子
    - id: route_sum_gap
      label: 路径段没有逐段翻译成向量和
    - id: ratio_direction_error
      label: 分点比例方向写反
    - id: coordinate_overuse
      label: 不必要地提前进入坐标建系或数量积套公式
    - id: representation_gap
      label: 表征对应断裂
  feedback_principles:
    - 先让学生用图中路径说出每一段移动，再写符号表达。
    - 对比例方向错误，回到 AD/AB 和 AE/AC 的起点方向检查。
    - 对坐标法或数量积法冲动，先追问“题目第一问是否真的要求长度、夹角、垂直或坐标数值”。
    - 对“D = mp、E = nq”这类简写，提醒它只能作为以 A 为共同起点的位置向量口头简写；正式板书优先写 AD = mp、AE = nq。
    - 只比较建模路径，不把本板扩展成完整解题器。
visual_semantics:
  basis_ab: 蓝色表示基向量 AB。
  basis_ac_or_bc: 青绿色表示第二个基向量 AC 或 BC。
  route_trace: 琥珀色表示当前 D 到 E 的路径。
  target_vector: 深红色表示目标向量 DE。
  side_lines: 灰色表示原三角形边和未选路径。
  rule: 颜色只承载数学对象或策略含义，不作为装饰。
