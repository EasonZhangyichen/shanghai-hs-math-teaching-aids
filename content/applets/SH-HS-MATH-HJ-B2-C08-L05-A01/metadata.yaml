schema_version: 0.1.0
id: SH-HS-MATH-HJ-B2-C08-L05-A01
version: 0.1.0
status: draft
resource_type: applet
title: 数量积动态解释器
subtitle: 围绕向量的数量积的定义与运算律的交互式数字教具骨架
curriculum:
  region: 上海
  stage: 高中
  subject: 数学
  edition: 沪教版
  volume_id: B2
  volume_title: 必修第二册
  chapter_id: SH-HS-MATH-HJ-B2-C08
  chapter_title: 平面向量
  section_id: SH-HS-MATH-HJ-B2-C08-S02
  section_title: 向量的数量积
  lesson_id: SH-HS-MATH-HJ-B2-C08-L05
  textbook_ref: 8.2.2
  lesson_title: 向量的数量积的定义与运算律
pedagogy:
  cognitive_action: 比较
  estimated_classroom_minutes: 12
  primary_teaching_problem: 学生容易把数量积误认为仍是向量，忽略结果是数量。
  learning_goals:
    - 围绕向量的数量积的定义与运算律建立可观察、可解释的数学表征。
    - 用“比较”方式处理关键变量、边界条件和典型错因。
    - 把交互观察转化为可板书、可追问、可迁移的课堂结论。
  prerequisites:
    - 向量的数量积的定义与运算律相关先修知识
  successors:
    - 后续课时学习与综合应用
  core_competencies:
    - 直观想象
    - 逻辑推理
    - 数学运算
mathematical_scope:
  focus: 同步展示两个向量、夹角、投影和数量积数值，突出正、零、负三种区域。
  lesson: 向量的数量积的定义与运算律
  out_of_scope:
    - 本 scaffold 只定义首版交互骨架，数学细节需在资源生产对话中补齐。
representations:
  - id: interactive_canvas
    role: 承载可拖拽、可观察、可复现的核心数学表征。
  - id: teacher_readout
    role: 为教师提供课堂追问所需的关键状态读数。
interaction_design:
  primary_control: 预留一个核心滑块或拖拽控制，后续按知识点定制。
  teacher_controls:
    - 重置
    - 分步显示
    - 重点标注
  student_controls:
    - 拖动观察
    - 记录猜想
    - 对照结论
  staged_reveal:
    - step: observe
      description: 先让学生观察变量变化和图像响应。
    - step: explain
      description: 再引导学生用符号语言解释观察结果。
data_contract:
  state_variables:
    - name: current_value
      value_type: number
      default: 0
      description: 首版 scaffold 的占位状态变量，后续替换为真实数学变量。
      persistence: snapshot
  events:
    - name: state_changed
      direction: applet_to_player
      description: 交互状态变化时通知平台播放器。
      payload:
        - current_value
      required_for_player: true
feedback_and_diagnosis:
  success_evidence:
    - 学生能说清楚观察变量、图像变化和数学结论之间的对应关系。
  common_error_tags:
    - id: representation_gap
      label: 表征对应断裂
  feedback_principles:
    - 反馈先指向可视化证据，再回到符号表达。
visual_semantics:
  primary_color: teal
  emphasis_rule: 当前变量用高对比色标注，历史轨迹和辅助线降低透明度。
implementation:
  phase: content_spec_only
  html_src_status: scaffolded
  planned_engine: native-canvas-svg
  create_src_in_later_task: false
  classroom_device_targets:
    - desktop
    - tablet
    - projector
files:
  readme: README.md
  teacher_script: teacher-script.md
  student_task: student-task.md
  review_record: review.md
  src_entry: src/index.html
compliance:
  copyright_note: 本 scaffold 仅生成原创资源骨架，不复制教材正文、官方课件、教案或商业题库。
  review_status: self_checked_draft

