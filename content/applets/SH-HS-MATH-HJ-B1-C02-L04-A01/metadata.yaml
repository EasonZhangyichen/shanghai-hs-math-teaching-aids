schema_version: 0.1.0
id: SH-HS-MATH-HJ-B1-C02-L04-A01
version: 0.1.0
status: draft
resource_type: applet
title: 参数不等式解集数轴实验室
subtitle: 拖动参数观察一次不等式解集的方向、端点开闭和退化情形
curriculum:
  region: 上海
  stage: 高中
  subject: 数学
  edition: 沪教版
  volume_id: B1
  volume_title: 必修第一册
  chapter_id: SH-HS-MATH-HJ-B1-C02
  chapter_title: 等式与不等式
  section_id: SH-HS-MATH-HJ-B1-C02-S02
  section_title: 不等式的求解
  lesson_id: SH-HS-MATH-HJ-B1-C02-L04
  textbook_ref: 2.2.1
  lesson_title: 一元一次不等式及一元一次不等式组的求解
pedagogy:
  cognitive_action: 变换
  estimated_classroom_minutes: 12
  primary_teaching_problem: 学生能按步骤移项求解一次不等式，但遇到含参数系数时容易忘记按参数符号分类，也容易混淆数轴端点开闭和空集、全集情形。
  learning_goals:
    - 通过拖动参数 a 和 b，观察 a 的符号决定不等式方向是否改变。
    - 用数轴阴影判断解集向左或向右延伸，并把开闭端点与严格、不严格不等号对应起来。
    - 读出临界点由参数决定的位置变化，理解 a 为 0 时不再产生分界点。
    - 区分一条射线解集、空集和全集三类形态。
  prerequisites:
    - 不等式的加法性质和乘法性质
    - 数轴和区间表示
    - 集合交集和空集
  successors:
    - SH-HS-MATH-HJ-B1-C02-L05
    - SH-HS-MATH-HJ-B1-C05-L01
    - SH-HS-MATH-HJ-B1-C05-L07
  core_competencies:
    - 直观想象
    - 逻辑推理
    - 数学运算
mathematical_scope:
  focus: 围绕含参数一次不等式 ax + b 与 0 的大小关系，联动显示参数符号、临界点、数轴阴影、端点开闭、空集和全集。
  lesson: 一元一次不等式及一元一次不等式组的求解
  inequality_model: 使用 ax + b 与 0 的大小关系作为动态模型，a 和 b 均由滑块控制。
  classification_rule: a 大于 0 时直接按原不等号读 x 的范围；a 小于 0 时除以负数后不等号方向改变；a 等于 0 时退化为常真或常假命题。
  endpoint_rule: 严格不等号对应空心端点，不严格不等号对应实心端点；a 的正负只改变方向，不改变端点开闭。
  default_parameters:
    a: 2
    b: -4
    relation: le
  out_of_scope:
    - 常规移项和化简题库训练
    - 一元一次不等式组交集的系统训练
    - 二次、分式、绝对值不等式
    - 用函数观点求解不等式的后续课时展开
    - 超出 draft / self_checked_draft 草稿边界的正式流转
representations:
  - id: parameter_controls
    role: 用滑块和不等号按钮控制参数 a、b 与大小关系。
  - id: inequality_readout
    role: 同步显示当前不等式、除以 a 时的方向变化和临界点公式。
  - id: number_line
    role: 用数轴阴影展示解集方向、端点开闭、空集和全集。
  - id: classification_panel
    role: 用文字总结 a 大于 0、a 小于 0、a 等于 0 三种分类依据。
  - id: staged_summary
    role: 供教师按参数、临界点、数轴、分类四步揭示。
interaction_design:
  primary_control: 拖动 a 和 b 两个参数滑块，并切换小于、小于等于、大于、大于等于，观察数轴解集如何变化。
  teacher_controls:
    - 重置到默认状态
    - 正系数、负系数、全集、空集四个典型状态
    - 按参数、临界点、数轴、分类四步揭示
  student_controls:
    - 调节 a 的符号，观察解集方向是否改变
    - 调节 b 的值，观察临界点在数轴上的位置移动
    - 切换严格或不严格不等号，观察端点开闭
  staged_reveal:
    - step: observe_parameter_sign
      description: 先看 a 的符号，判断除以 a 后方向是否改变。
    - step: locate_critical_point
      description: 显示临界点由参数决定，并观察 b 改变时分界点移动。
    - step: read_number_line
      description: 对照数轴阴影方向和端点开闭，说出解集。
    - step: classify_degenerate_case
      description: 讨论 a 等于 0 时没有分界点，可能得到全集或空集。
data_contract:
  state_variables:
    - name: coefficient_a
      value_type: number
      default: 2
      description: x 的系数 a。
      persistence: snapshot
    - name: constant_b
      value_type: number
      default: -4
      description: 常数项 b。
      persistence: snapshot
    - name: relation
      value_type: string
      default: le
      description: 当前选择的小于、小于等于、大于或大于等于关系。
      persistence: snapshot
    - name: critical_point
      value_type: number
      default: 2
      description: a 不等于 0 时的临界点。
      persistence: snapshot
    - name: solution_kind
      value_type: string
      default: ray
      description: 当前解集类型，可为射线、全集或空集。
      persistence: snapshot
    - name: reveal_step
      value_type: number
      default: 1
      description: 当前教师分步揭示阶段。
      persistence: snapshot
  events:
    - name: ready
      direction: applet_to_player
      description: 课件完成初始渲染。
      payload:
        - coefficient_a
        - constant_b
        - relation
        - critical_point
        - solution_kind
        - reveal_step
      required_for_player: true
    - name: state_changed
      direction: applet_to_player
      description: 参数、关系、典型状态或揭示阶段变化时通知播放器。
      payload:
        - coefficient_a
        - constant_b
        - relation
        - critical_point
        - solution_kind
        - reveal_step
      required_for_player: true
feedback_and_diagnosis:
  success_evidence:
    - 学生能先判断 a 的符号，再说明是否需要改变不等号方向。
    - 学生能把严格不等号对应到空心端点，把不严格不等号对应到实心端点。
    - 学生能解释 b 改变只会移动临界点，不单独决定取左侧还是右侧。
    - 学生能在 a 等于 0 时判断当前不等式对所有 x 成立或没有解。
  common_error_tags:
    - id: sign_flip_missing
      label: 除以负参数时忘记改变不等号方向
    - id: endpoint_open_closed_confusion
      label: 严格和不严格不等号对应的端点开闭混淆
    - id: critical_point_motion_gap
      label: 不能说明参数改变如何移动临界点
    - id: degenerate_case_missing
      label: 漏掉 a 等于 0 时的全集或空集情形
  feedback_principles:
    - 先问 a 的符号，再讨论临界点和数轴方向。
    - 纠正端点错误时只切换不等号，保持 a 和 b 不变。
    - 纠正方向错误时让 a 从正数连续跨到负数，观察阴影方向翻转。
    - 遇到 a 等于 0 时明确说明不再是一次不等式，而是常真或常假的判断。
visual_semantics:
  solution_ray: 绿色粗线表示满足不等式的 x 的范围。
  critical_point: 深色端点表示临界点，空心或实心体现是否取到。
  zero_case: 紫色提示用于 a 等于 0 的全集或空集情形。
  direction_change: 橙色强调除以负参数时方向改变。
  rule: 颜色只承载数学对象含义，不作为装饰。
implementation:
  phase: runnable_prototype
  html_src_status: runnable
  planned_engine: native-canvas-svg
  create_src_in_later_task: false
  classroom_device_targets:
    - desktop
    - tablet
    - projector
files:
  readme: README.md
  teacher_script: teacher-script.md
  student_task: student-task.md
  review_record: review.md
