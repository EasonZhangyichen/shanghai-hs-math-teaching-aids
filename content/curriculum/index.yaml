                proposed_resource_id: "SH-HS-MATH-HJ-B2-C06-L05-D01"
                title: "已知三角值求角多解诊断"
                cognitive_action: "比较"
                note: "用短题即时标注象限遗漏、周期遗漏、主值误用和正切周期误判；不做完整代数解题器。"
            diagnosis_focus:
              - "能否根据三角值和象限条件列出完整角集。"
              - "能否区分正弦/余弦的 2pi 周期和正切的 pi 周期。"
            core_competencies:
              - "逻辑推理"
              - "数学运算"
          - id: "SH-HS-MATH-HJ-B2-C06-L06"
            textbook_ref: "6.2.1"
            title: "两角和与差的正弦、余弦、正切公式"
