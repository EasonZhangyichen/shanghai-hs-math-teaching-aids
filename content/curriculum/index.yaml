          - id: "SH-HS-MATH-HJ-B2-C06-K02"
            title: "单位圆中的三角比"
          - id: "SH-HS-MATH-HJ-B2-C07-K01"
            title: "三角函数中的角、方向和周期直觉"
          - id: "SH-HS-MATH-HJ-B1-GEOM-K01"
