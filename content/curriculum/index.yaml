        follow_up_knowledge:
          - id: "SH-HS-MATH-HJ-B2-C09-K01"
            title: "复数的几何意义与复平面"
          - id: "SH-HS-MATH-HJ-B3-C10-K01"
            title: "空间直线与平面的方向关系"
          - id: "SH-HS-MATH-HJ-XB1-SPACEVEC-K01"
