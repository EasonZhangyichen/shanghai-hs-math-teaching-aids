              - "SH-HS-MATH-HJ-B2-C06-L08"
              - "SH-HS-MATH-HJ-B2-C07-L05"
            teaching_pain_points:
              - "学生容易只机械套公式，不能判断角度拆分是否有利于计算。"
              - "正切和差公式的分母条件容易遗漏。"
              - "公式之间的选择路径不清，导致代数变形冗长。"
            diagnosis_focus:
              - "能否根据目标式选择合适的和差公式。"
              - "能否检查正切公式的适用条件。"
            core_competencies:
              - "逻辑推理"
              - "数学运算"
