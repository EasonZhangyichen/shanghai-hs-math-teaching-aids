        lessons:
          - id: "SH-HS-MATH-HJ-B2-C06-L01"
            textbook_ref: "6.1.1"
            title: "锐角的正弦、余弦、正切、余切"
            status: "draft"
            estimated_periods: null
            core_knowledge:
              - "回顾直角三角形中锐角的正弦、余弦、正切和余切"
              - "把边长比和角的大小对应起来"
              - "为任意角三角比扩展保留几何来源"
            prerequisites:
              - "直角三角形边角关系"
              - "相似三角形"
              - "平面直角坐标系"
            successors:
              - "SH-HS-MATH-HJ-B2-C06-L02"
              - "SH-HS-MATH-HJ-B2-C06-L03"
            teaching_pain_points:
              - "学生容易把锐角三角比只记为边名比例，不能说明比例为何只由角决定。"
              - "余切在初中经验中较弱，和正切互倒关系容易机械记忆。"
              - "从直角三角形过渡到坐标系终边时，几何来源容易断裂。"
            diagnosis_focus:
              - "能否根据直角三角形准确写出四个锐角三角比。"
              - "能否解释同一锐角在相似直角三角形中的三角比不变。"
            core_competencies:
              - "直观想象"
              - "数学抽象"
          - id: "SH-HS-MATH-HJ-B2-C06-L02"
            textbook_ref: "6.1.2"
            title: "任意角及其度量"
            status: "draft"
            estimated_periods: null
            core_knowledge:
              - "用旋转方向和旋转量理解正角、负角、零角和终边相同角"
              - "理解角度制与弧度制的对应关系"
              - "把弧度量解释为单位圆上的弧长与半径之比"
            prerequisites:
              - "角的几何概念"
              - "圆、半径和弧长"
              - "平面直角坐标系中的射线和旋转"
            successors:
              - "SH-HS-MATH-HJ-B2-C06-L03"
              - "SH-HS-MATH-HJ-B2-C07-L01"
              - "SH-HS-MATH-HJ-B2-C07-L06"
            teaching_pain_points:
              - "学生容易把任意角只看作超过 180 度的角，忽略方向和旋转过程。"
              - "终边相同角的一般式容易漏写整数参数或符号方向。"
              - "弧度制常被当作换算公式，不能解释为什么横轴可以用弧度量表示角。"
            digital_entry_points:
              - type: "applet"
                proposed_resource_id: "SH-HS-MATH-HJ-B2-C06-L02-A01"
                title: "任意角与弧度动态量角器"
                cognitive_action: "旋转"
                note: "拖动终边显示正负旋转、终边相同角、角度制和弧度制，并把单位圆弧长与弧度量同步联动；只服务任意角和弧度意义，不做普通换算刷题。"
            diagnosis_focus:
              - "能否写出终边相同角的一般式。"
              - "能否说明弧度量和单位圆弧长的关系。"
            core_competencies:
              - "直观想象"
              - "数学抽象"
          - id: "SH-HS-MATH-HJ-B2-C06-L03"
            textbook_ref: "6.1.3"
            title: "任意角的正弦、余弦、正切、余切"
            status: "draft"
            estimated_periods: null
            core_knowledge:
              - "用终边上一点或单位圆坐标定义任意角的正弦、余弦、正切和余切"
              - "判断四个三角比在不同象限和坐标轴上的符号与定义域"
              - "把坐标、单位圆和三角比数值联系起来"
            prerequisites:
              - "任意角和弧度制"
              - "锐角三角比"
              - "平面直角坐标系和单位圆"
            successors:
              - "SH-HS-MATH-HJ-B2-C06-L04"
              - "SH-HS-MATH-HJ-B2-C06-L05"
              - "SH-HS-MATH-HJ-B2-C07-L01"
              - "SH-HS-MATH-HJ-B2-C07-L03"
              - "SH-HS-MATH-HJ-B2-C07-L06"
            teaching_pain_points:
              - "学生容易把任意角三角比仍理解成直角三角形边长比，忽略坐标定义。"
              - "象限符号和轴上角的定义边界容易混淆。"
              - "正切、余切无定义条件常被漏掉，影响后续正切函数定义域。"
            digital_entry_points:
              - type: "applet"
                proposed_resource_id: "SH-HS-MATH-HJ-B2-C06-L03-A01"
                title: "单位圆三角比与终边联动板"
                cognitive_action: "投影"
                note: "拖动单位圆终边，同步显示坐标、四个三角比、象限符号和无定义状态，突出三角比几何意义与第7章函数值来源。"
              - type: "diagnosis"
                proposed_resource_id: "SH-HS-MATH-HJ-B2-C06-L03-D01"
                title: "任意角三角比符号与定义域诊断"
                cognitive_action: "比较"
                note: "围绕象限符号、轴上角、正切/余切无定义和坐标比值来源给即时错因反馈；不替代纸笔求值训练。"
            diagnosis_focus:
              - "能否根据终边位置判断三角比符号。"
              - "能否说明正切和余切何时无定义。"
            core_competencies:
              - "直观想象"
              - "数学抽象"
              - "逻辑推理"
          - id: "SH-HS-MATH-HJ-B2-C06-L04"
            textbook_ref: "6.1.4"
            title: "诱导公式"
            status: "draft"
            estimated_periods: null
            core_knowledge:
              - "用终边相同角和单位圆对称关系理解诱导公式"
              - "从象限和参考角判断三角比符号"
              - "把诱导公式作为第7章周期性、奇偶性和图像对称性的前置语言"
            prerequisites:
              - "任意角三角比"
              - "单位圆坐标"
              - "平面中的轴对称和中心对称"
            successors:
              - "SH-HS-MATH-HJ-B2-C06-L05"
              - "SH-HS-MATH-HJ-B2-C07-L02"
              - "SH-HS-MATH-HJ-B2-C07-L04"
              - "SH-HS-MATH-HJ-B2-C07-L07"
            teaching_pain_points:
              - "学生容易把诱导公式作为孤立口诀记忆，不能解释符号变化来源。"
              - "参考角、象限和函数名是否改变之间的关系容易混乱。"
              - "诱导公式和后续三角函数图像对称性的联系不够清楚。"
            digital_entry_points:
              - type: "applet"
                proposed_resource_id: "SH-HS-MATH-HJ-B2-C06-L04-A01"
                title: "诱导公式单位圆对称板"
                cognitive_action: "比较"
                note: "只用单位圆上的对称映射解释公式来源，支持教师切换 alpha、pi-alpha、pi+alpha、2pi-alpha 等关系；不把纯公式记忆做成动画。"
            diagnosis_focus:
              - "能否从单位圆对称判断三角比符号。"
              - "能否把诱导公式和三角函数图像的奇偶性、周期性连接起来。"
            core_competencies:
              - "逻辑推理"
              - "直观想象"
              - "数学抽象"
          - id: "SH-HS-MATH-HJ-B2-C06-L05"
            textbook_ref: "6.1.5"
            title: "已知正弦、余弦或正切值求角"
            status: "draft"
            estimated_periods: null
            core_knowledge:
              - "根据三角比值和象限条件确定角"
              - "用单位圆和终边相同角表达多解结构"
              - "区分特殊角求值、主值判断和一般解书写"
            prerequisites:
              - "任意角三角比"
              - "诱导公式"
              - "特殊角三角比值"
            successors:
