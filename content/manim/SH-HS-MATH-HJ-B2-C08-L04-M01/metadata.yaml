schema_version: "0.1.0"
id: "SH-HS-MATH-HJ-B2-C08-L04-M01"
version: "0.1.0"
status: "draft"
resource_type: "manim_clip"
title: "投影有向长度导入动画"
subtitle: "把投影长度的正、零、负看成有向读数"
curriculum:
  region: "上海"
  stage: "高中"
  subject: "数学"
  edition: "沪教版"
  volume_id: "B2"
  volume_title: "必修第二册"
  chapter_id: "SH-HS-MATH-HJ-B2-C08"
  chapter_title: "平面向量"
  section_id: "SH-HS-MATH-HJ-B2-C08-S02"
  section_title: "向量的数量积"
  lesson_id: "SH-HS-MATH-HJ-B2-C08-L04"
  textbook_ref: "8.2.1"
  lesson_title: "向量的投影"
pedagogy:
  cognitive_action: "投影"
  estimated_classroom_minutes: 6
  primary_teaching_problem: "学生容易把投影长度看成普通线段长，忽略它是有方向符号的量。"
  learning_goals:
    - "看见向量 a 的终点向向量 b 所在直线作垂线后，投影点在有向轴上的位置。"
    - "区分普通线段长与有向投影长度，解释锐角、直角、钝角时符号不同。"
    - "把有向投影长度与 |a|cosθ 的正、零、负连接起来，并预告下一课会与数量积联系。"
  prerequisites:
    - "向量的几何表示与夹角"
    - "余弦值的正负"
    - "垂线、垂足和直角三角形"
  successors:
    - "SH-HS-MATH-HJ-B2-C08-L04-A01"
    - "SH-HS-MATH-HJ-B2-C08-L05"
  core_competencies:
    - "直观想象"
    - "逻辑推理"
    - "数学运算"
  classroom_use: "建议在「向量的投影」课堂开头播放约 37 秒。本片无内置音轨，需教师现场口播；播放前应确认两处暂停点和末尾数量积衔接口径，再切到 Applet 做拖动验证。"
mathematical_scope:
  focus: "短动画只串联定方向、作垂线、读有向投影、解释 |a|cosθ 的正零负，不替代后续交互探索。"
  lesson: "向量的投影"
  projected_vector: "向量 a"
  baseline_vector: "向量 b 的方向作为有向轴"
  directed_length: "|a|cosθ"
  angle_range: "0 ≤ θ ≤ π；锐角投影长度为正，直角为零，钝角为负。"
  dot_product_bridge: "只预告下一课会把有向投影长度与数量积联系起来，不展示数量积定义式。"
  teacher_watch_gate:
    internal_queue: "teacher_watch_ready"
    confirmation_before_classroom_trial:
      - "确认教师口播会明确：这里读的是有方向符号的长度，不是普通非负线段长。"
      - "确认教师只在画面文字稳定后暂停，不在锐角到直角或直角到钝角的旋转过渡中暂停。"
      - "确认末尾只作 L05 数量积衔接，不提前写出完整数量积定义式或运算律。"
      - "确认平台入口仍只是 video_ready 预览，不代表课堂试用或发布通过。"
  key_angles:
    - label: "锐角"
      projection_position: "投影点 H 在 b 的正方向"
      directed_length_sign: "投影长度 = |a|cosθ > 0"
    - label: "直角"
      projection_position: "投影点 H 与 O 重合"
      directed_length_sign: "投影长度 = 0"
    - label: "钝角"
      projection_position: "投影点 H 在 b 的反方向"
      directed_length_sign: "投影长度 = |a|cosθ < 0"
  out_of_scope:
    - "不展开完整数量积定义、运算律或应用题。"
    - "不替代 SH-HS-MATH-HJ-B2-C08-L04-A01 的交互探索。"
    - "不处理第 8 章 8.3 暂缓资源或课时边界问题。"
representations:
  - id: baseline_axis
    role: "表示向量 b 的方向，也是读取有向投影长度的正方向。"
  - id: vector_a
    role: "表示被投影的向量 a，随夹角从锐角转到直角再转到钝角。"
  - id: perpendicular_drop
    role: "从向量 a 的终点向基准方向作垂线，生成投影点 H。"
  - id: directed_segment
    role: "用带方向的线段表示投影长度的正、零、负。"
narrative_design:
  target_duration_seconds: 37
  beats:
    - id: set_direction
      title: "先定方向"
      purpose: "让学生先把向量 b 的方向看作有正负的读取轴，而不是普通线段。"
      visuals:
        - "水平有向轴、向量 b 和反方向提示。"
        - "向量 a 从同一起点出发，夹角 θ 标在两向量之间。"
      estimated_seconds: 8
    - id: drop_perpendicular
      title: "作垂线读投影点"
      purpose: "从 a 的终点向 b 的方向作垂线，强调投影点 H 落在有向轴上。"
      visuals:
        - "从 a 的终点落下垂线。"
        - "投影点 H 在有向轴上出现，并显示有向线段 OH。"
      estimated_seconds: 9
    - id: compare_signs
      title: "比较正零负"
      purpose: "用锐角、直角、钝角三种状态解释投影长度的符号变化。"
      visuals:
        - "锐角：H 在正方向，投影长度 = |a|cosθ > 0。"
        - "直角：H 与 O 重合，投影长度 = 0。"
        - "钝角：H 在反方向，投影长度 = |a|cosθ < 0。"
      estimated_seconds: 15
    - id: preview_next_lesson
      title: "预告下一课联系"
      purpose: "只预告下一课会用有向投影长度理解数量积，不展开下一课完整教学。"
      visuals:
        - "保留有向投影线段。"
        - "出现“下一课：用有向投影理解数量积”的文字预告。"
      estimated_seconds: 4
  pause_points:
    - after_beat: drop_perpendicular
      teacher_prompt: "建议在 00:09-00:11、H 和有向线段 OH 稳定后暂停：如果只看普通线段长，哪里会丢掉方向信息？"
    - after_beat: compare_signs
      teacher_prompt: "建议在 00:27-00:29、钝角文字稳定后暂停：为什么夹角变成钝角后，投影不是更长或更短的问题，而是符号变成负？"
visual_semantics:
  background: "light classroom background"
  baseline_axis: "基准方向用稳定深色箭头表示，向量 b 用蓝色表示。"
  vector_a: "被投影向量用红色表示，随夹角连续转动。"
  perpendicular_drop: "垂线用灰色虚线表示，只承担构造作用。"
  directed_segment: "正向投影用绿色，零投影用灰色，负向投影用紫色，并通过箭头方向区分。"
  emphasis_rule: "只高亮 a、b、θ、投影点 H 和有向投影线段；数量积只作为末尾衔接。"
