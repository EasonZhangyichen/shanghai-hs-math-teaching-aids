schema_version: "0.1.0"
id: "SH-HS-MATH-HJ-B2-C07-L06-M01"
version: "0.1.0"
status: "draft"
resource_type: "manim_clip"
title: "为什么正切图像有渐近线"
subtitle: "从终边斜率逼近 y 轴解释 y = tan x 的定义域断裂"

curriculum:
  region: "上海"
  stage: "高中"
  subject: "数学"
  edition: "沪教版"
  volume_id: "B2"
  volume_title: "必修第二册"
  chapter_id: "SH-HS-MATH-HJ-B2-C07"
  chapter_title: "三角函数"
  section_id: "SH-HS-MATH-HJ-B2-C07-S04"
  section_title: "正切函数的图像与性质"
  lesson_id: "SH-HS-MATH-HJ-B2-C07-L06"
  textbook_ref: "7.4.1"
  lesson_title: "正切函数的图像"

pedagogy:
  cognitive_action: "逼近"
  estimated_classroom_minutes: 5
  primary_teaching_problem: "学生容易把正切图像画成连续曲线，却说不清为什么 x = π/2 + kπ（k ∈ Z）处没有函数值以及渐近线为什么出现在这些位置。"
  learning_goals:
    - "用 tan x = sin x / cos x 解释当 cos x 接近 0 时正切值快速增大或减小。"
    - "把终边接近 y 轴的斜率变化与函数图像上的竖直渐近线对应起来。"
    - "说明正切函数的图像不能跨过 x = π/2 + kπ（k ∈ Z），并用 tan(x + π) = tan x 解释周期为 π。"
  prerequisites:
    - "任意角的正切定义"
    - "单位圆中的正弦、余弦和同角关系"
    - "函数定义域和图像断点"
  successors:
    - "SH-HS-MATH-HJ-B2-C07-L06-A01"
    - "SH-HS-MATH-HJ-B2-C07-L07"
    - "SH-HS-MATH-HJ-XB1-DERIV-K01"
  core_competencies:
    - "直观想象"
    - "数学抽象"
    - "逻辑推理"
  classroom_use: "教师先播放约 1 分钟概念动画，在终边接近 y 轴和图像断开处暂停追问；随后切到正切函数图像生成器 Applet，让学生拖动角度验证两侧逼近趋势。"

mathematical_scope:
  function: "y = tan x"
  equivalent_definition: "tan x = sin x / cos x"
  independent_variable: "x"
  dependent_variable: "y"
  theta_range: "首版聚焦 (-π/2, π/2) 及相邻周期的图像延拓。"
  domain_exclusion: "x ≠ π/2 + kπ, k ∈ Z"
  vertical_asymptotes: "x = π/2 + kπ, k ∈ Z"
  period: "π"
  key_angles:
    - angle: "0"
      tangent: "0"
      role: "中心点"
    - angle: "π/4"
      tangent: "1"
      role: "基本斜率参照"
    - angle: "π/2"
      tangent: "未定义"
      role: "cos x = 0，对应竖直渐近线"
    - angle: "-π/2"
      tangent: "未定义"
      role: "cos x = 0，对应竖直渐近线"
  out_of_scope:
    - "正切函数单调性的一般证明"
    - "反正切函数"
    - "用导数解释斜率变化"

representations:
  - id: "unit_circle_ray"
    role: "显示终边、单位圆点和 cos x 逐渐接近 0。"
  - id: "slope_ratio"
    role: "把 tan x 写成 sin x / cos x，突出分母趋近 0。"
  - id: "tangent_graph"
    role: "同步显示 y = tan x 在一个主周期内向渐近线逼近。"
  - id: "asymptote_gap"
    role: "用竖直虚线和断开提示说明图像不能跨过定义域断点。"
  - id: "period_copy"
    role: "用 x 与 x + π 的对应点说明周期为 π。"

narrative_design:
  target_duration_seconds: 40
  beats:
    - id: "start_with_slope"
      title: "正切先看斜率"
      purpose: "把正切值从记忆公式拉回终边斜率。"
      visuals:
        - "左侧显示单位圆、终边和直角三角形。"
        - "右侧显示 y = tan x 的坐标轴和主周期。"
      estimated_seconds: 6
    - id: "cos_denominator_shrinks"
      title: "cos x 接近 0"
      purpose: "解释终边接近 y 轴时分母越来越小。"
      visuals:
        - "终边从 0 旋转到接近 π/2。"
        - "水平的 cos x 段缩短，斜率读数增大。"
      estimated_seconds: 9
    - id: "graph_runs_up"
      title: "图像向上逼近渐近线"
      purpose: "把斜率无界和图像趋向无穷对应起来。"
      visuals:
        - "图像点沿 y = tan x 向 x = π/2 左侧上升。"
        - "x = π/2 竖直虚线高亮。"
      estimated_seconds: 8
    - id: "no_value_no_bridge"
      title: "这里没有函数值"
      purpose: "强调定义域断裂，不能把两侧连成一条连续曲线。"
      visuals:
        - "显示 cos x = 0，所以 tan x 未定义。"
        - "渐近线两侧分别趋向 +∞ 和 -∞。"
      estimated_seconds: 8
    - id: "copy_by_period"
      title: "隔 π 重复一次"
      purpose: "说明正切周期为 π，而不是正弦余弦的 2π。"
      visuals:
        - "相邻周期曲线淡入。"
        - "箭头标注 tan(x + π) = tan x。"
      estimated_seconds: 6
    - id: "close_the_rule"
      title: "画图规则"
      purpose: "收束为定义域、渐近线和周期三条课堂规则。"
      visuals:
        - "右侧归纳面板列出 domain、asymptotes、period。"
      estimated_seconds: 3
  pause_points:
    - after_beat: "cos_denominator_shrinks"
      teacher_prompt: "当终边越来越接近 y 轴时，sin x 和 cos x 哪一个在接近 0？这会怎样影响 sin x / cos x？"
    - after_beat: "no_value_no_bridge"
      teacher_prompt: "为什么图像不能穿过 x = π/2 继续连起来？"
    - after_beat: "copy_by_period"
      teacher_prompt: "为什么这里重复的间隔是 π，而不是 2π？"

visual_semantics:
  circle_objects: "蓝色表示单位圆、终边和当前角。"
  tangent_curve: "红色表示 y = tan x 的当前主周期图像。"
  asymptotes: "紫色虚线表示定义域断点对应的竖直渐近线。"
  ratio_parts: "sin x 用绿色，cos x 用橙色，强调分子和分母的不同变化。"
  copied_period: "灰色曲线表示由周期 π 平移得到的相邻图像。"
  rule: "颜色只用于数学对象含义，不作为装饰。"

