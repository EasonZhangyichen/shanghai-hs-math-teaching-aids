schema_version: "0.1.0"
resource_id: "SH-HS-MATH-HJ-B2-C07-L02-D01"
title: "正弦函数性质诊断题组"
estimated_minutes: 8
total_score: 10
mastery_threshold: 0.75
misconception_tags:
  - "period_omission"
  - "period_length_confusion"
  - "monotonic_endpoint_confusion"
  - "axis_center_mixup"
  - "extrema_zero_formula_omission"
  - "local_interval_overgeneralization"

items:
  - id: "D01-Q01"
    type: "multiple_select"
    score: 1
    title: "基础性质与零点"
    diagnostic_focus: "能否同时确认定义域、值域、周期、奇偶性和零点一般式。"
    prompt: "关于函数 y = sin x 的基础性质和零点，下列说法正确的是哪些？"
    choices:
      - id: "A"
        text: "定义域是 R，值域是 [-1, 1]。"
        is_correct: true
        feedback: "正弦函数对任意实数 x 都有定义，函数值始终在 -1 和 1 之间。"
      - id: "B"
        text: "最小正周期是 2π，并且 y = sin x 是奇函数。"
        is_correct: true
        feedback: "sin(x + 2π) = sin x，sin(-x) = -sin x。"
      - id: "C"
        text: "全部零点可以写作 x = kπ，k ∈ Z。"
        is_correct: true
        feedback: "k ∈ Z 能覆盖 0、±π、±2π 等所有零点。"
      - id: "D"
        text: "相邻两个零点间隔 π，所以最小正周期是 π。"
        is_correct: false
        misconception_tags: ["period_length_confusion"]
        feedback: "零点间隔 π 不等于函数周期；整体图像重复需要平移 2π。"
    answer: ["A", "B", "C"]
    scoring_note: "全选 A、B、C 且不选 D 得 1 分；选择 D 时记录 period_length_confusion。"
    feedback_on_correct: "能把定义域、值域、周期、奇偶性和零点一般式放在同一张性质表中判断。"

  - id: "D01-Q02"
    type: "single_choice"
    score: 1
    title: "最值点横坐标"
    diagnostic_focus: "能否区分最大值点、最小值点和只写特殊值。"
    prompt: "函数 y = sin x 的最大值点和最小值点横坐标应如何完整表达？"
    choices:
      - id: "A"
        text: "最大值 1：x = π/2 + 2kπ；最小值 -1：x = -π/2 + 2kπ，k ∈ Z"
        is_correct: true
        feedback: "最大值点和最小值点都每隔 2π 重复一次，且两类点不能混用。"
      - id: "B"
        text: "最大值 1：x = π/2 + kπ；最小值 -1：x = -π/2 + kπ，k ∈ Z"
        is_correct: false
        misconception_tags: ["extrema_zero_formula_omission"]
        feedback: "这两组写法都会把最大值点和最小值点交替混在一起。"
      - id: "C"
        text: "最大值 1：x = π/2；最小值 -1：x = 3π/2"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "这里只写出一个周期中的最值点，遗漏了所有 2π 平移后的点。"
      - id: "D"
        text: "最大值和最小值都出现在 x = kπ，k ∈ Z"
        is_correct: false
        misconception_tags: ["extrema_zero_formula_omission"]
        feedback: "x = kπ，k ∈ Z 是零点横坐标，不是最值点横坐标。"
    answer: ["A"]
    feedback_on_correct: "最大值点、最小值点与零点已经分开表达。"

  - id: "D01-Q03"
    type: "single_choice"
    score: 2
    title: "递增区间"
    diagnostic_focus: "能否完整写出递增区间并保留周期。"
    prompt: "下列哪一项能完整表达 y = sin x 的递增区间？"
    choices:
      - id: "A"
        text: "[-π/2 + 2kπ, π/2 + 2kπ]，k ∈ Z"
        is_correct: true
        feedback: "这正是每个周期中的递增半周期。"
      - id: "B"
        text: "[-π/2, π/2]"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "这是一个递增区间，但没有写出所有周期中的递增区间。"
      - id: "C"
        text: "[π/2 + 2kπ, 3π/2 + 2kπ]，k ∈ Z"
        is_correct: false
        misconception_tags: ["monotonic_endpoint_confusion"]
        feedback: "这段从最大值走向最小值，是递减区间。"
      - id: "D"
        text: "[2kπ, π + 2kπ]，k ∈ Z"
        is_correct: false
        misconception_tags: ["local_interval_overgeneralization", "monotonic_endpoint_confusion"]
        feedback: "这段先增后减，不能作为一个单调递增区间。"
    answer: ["A"]
    feedback_on_correct: "能用端点和周期同时描述单调区间。"

  - id: "D01-Q04"
    type: "multiple_select"
    score: 2
    title: "对称轴与对称中心"
    diagnostic_focus: "能否区分竖直对称轴和中心对称点。"
    prompt: "关于 y = sin x 的对称性，下列说法正确的是哪些？"
    choices:
      - id: "A"
        text: "x = π/2 + kπ，k ∈ Z，是正弦图像的对称轴"
        is_correct: true
        feedback: "每个最大值点或最小值点所在竖直直线都是对称轴。"
      - id: "B"
        text: "(kπ, 0)，k ∈ Z，是正弦图像的对称中心"
        is_correct: true
        feedback: "每个零点都是中心对称点。"
      - id: "C"
        text: "x = kπ，k ∈ Z，是正弦图像的对称轴"
        is_correct: false
        misconception_tags: ["axis_center_mixup"]
        feedback: "x = kπ 对应的是对称中心的横坐标，不是竖直对称轴。"
      - id: "D"
        text: "(π/2 + 2kπ, 1)，k ∈ Z，是正弦图像的对称中心"
        is_correct: false
        misconception_tags: ["axis_center_mixup"]
        feedback: "这是最大值点；经过它的竖直直线 x = π/2 + 2kπ 是对称轴的一部分，但点本身不是对称中心。"
    answer: ["A", "B"]
    scoring_note: "全选且不多选得 2 分；漏选 A 或 B 得 1 分；选择 C 或 D 时记录 axis_center_mixup。"
    feedback_on_correct: "能把对称轴和对称中心作为不同几何对象处理。"

  - id: "D01-Q05"
    type: "short_explanation"
    score: 2
    title: "局部观察与单调区间"
    diagnostic_focus: "能否解释为什么整段区间不是单调区间。"
    prompt: "有同学说：因为 sin 0 = 0，sin(π/2) = 1，sin π = 0，所以 y = sin x 在 [0, π] 上是递增的。请判断这句话是否正确，并说明理由。"
    expected_response:
      - "这句话不正确。"
      - "在 [0, π/2] 上函数值增加，在 [π/2, π] 上函数值减少。"
      - "π/2 是转折端点，不能把 [0, π] 作为一个递增区间。"
      - "完整递增区间应写作 [-π/2 + 2kπ, π/2 + 2kπ]，k ∈ Z。"
    misconception_tags_when_incomplete:
      - "local_interval_overgeneralization"
      - "monotonic_endpoint_confusion"
      - "period_omission"
    feedback_on_correct: "能用端点比较解释单调性，而不是只看局部函数值。"

  - id: "D01-Q06"
    type: "error_analysis"
    score: 2
    title: "综合错因订正"
    diagnostic_focus: "能否同时订正关键点、周期长度、周期遗漏和对称元素。"
    prompt: "某学生写道：y = sin x 的最大值点横坐标是 x = π/2；零点是 x = 0, π；最小正周期是 π；对称中心是 (π/2, 1)。请指出至少两处错误并改正。"
    expected_response:
      - "最大值点横坐标应为 x = π/2 + 2kπ，k ∈ Z。"
      - "零点应为 x = kπ，k ∈ Z。"
      - "最小正周期应为 2π，不是 π。"
      - "对称中心应为 (kπ, 0)，k ∈ Z。"
      - "点 (π/2 + 2kπ, 1) 是最大值点；经过它的竖直直线 x = π/2 + 2kπ 是对称轴的一部分，不是对称中心。"
    misconception_tags_when_incomplete:
      - "period_omission"
      - "period_length_confusion"
      - "axis_center_mixup"
      - "extrema_zero_formula_omission"
    feedback_on_correct: "能从一个错误答案中分辨周期遗漏、关键点混用和对称对象混淆。"
