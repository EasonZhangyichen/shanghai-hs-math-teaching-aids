resource_type: diagnosis
title: 加减法方向四类短诊断
subtitle: 围绕首尾相接、平行四边形方向、减法相反向量和闭合路径的课堂即时诊断
curriculum:
  region: 上海
  stage: 高中
  subject: 数学
  edition: 沪教版
  volume_id: B2
  volume_title: 必修第二册
  chapter_id: SH-HS-MATH-HJ-B2-C08
  chapter_title: 平面向量
  section_id: SH-HS-MATH-HJ-B2-C08-S01
  section_title: 向量的概念和线性运算
  lesson_id: SH-HS-MATH-HJ-B2-C08-L02
  textbook_ref: 8.1.2
  lesson_title: 向量的加法和减法
pedagogy:
  cognitive_action: 比较
  estimated_classroom_minutes: 8
  primary_teaching_problem: 学生容易混淆三角形法则中的首尾相接和减法中的相反向量。
  learning_goals:
    - 根据几何路径判断向量加法的起点、转折点和终点。
    - 解释平行四边形法则中合向量从共同起点指向对角点的方向。
    - 把向量减法转化为加上相反向量，并辨析端点顺序。
    - 识别闭合路径的合位移为零向量，而不是误认为某一条边。
    - 根据错因标签选择课堂回讲或订正路径。
  prerequisites:
    - 向量相等和相反向量
    - 平移有向线段表示同一向量
    - 三角形和平行四边形中的基本路径关系
  successors:
    - SH-HS-MATH-HJ-B2-C08-L03
    - SH-HS-MATH-HJ-B2-C08-L04
    - SH-HS-MATH-HJ-B2-C08-L10
  core_competencies:
    - 逻辑推理
    - 数学运算
    - 直观想象
  classroom_use: 课堂末尾 8 到 10 分钟即时诊断，也可作为作业讲评前的错因分流。
diagnosis_design:
  diagnostic_focus:
    - 能否用三角形法则识别首尾相接的路径合向量。
    - 能否把平行四边形法则解释为从共同起点指向对角点，而不是只记画图模板。
    - 能否把向量减法转化为加上相反向量，并得到正确方向。
    - 能否识别闭合路径的合位移为零向量。
    - 能否从几何图形中按端点顺序写出正确的向量等式。
  misconception_tags:
    - id: addition_direction_rule_confusion
      title: 加法方向法则混淆
      description: 学生不能稳定追踪三角形法则中的首尾相接，或把平行四边形法则中的合向量方向画反。
    - id: subtraction_opposite_vector_error
      title: 减法相反向量错误
      description: 学生把减法当成普通线段相减，未能先把被减向量改为相反向量再首尾相接。
    - id: closed_path_zero_misread
      title: 闭合路径零向量误读
      description: 学生看到闭合路径时仍写成某一条边，不能用回到起点解释合位移为零向量。
    - id: endpoint_order_reversal
      title: 端点顺序反向
      description: 学生把 AB 与 BA、AC 与 CA 等方向相反的向量混用，导致等式方向错误。
  item_summary:
    total_items: 6
    question_types:
      - draft_placeholder
      - single_choice
      - multiple_select
      - short_explanation
      - error_analysis
    estimated_minutes: 8
  feedback_strategy:
    immediate_feedback: 每题反馈先指出方向来源，再提示“起点、转折点、终点”或“减去即加相反向量”的订正动作。
    teacher_dashboard_notes: 统计四类错因命中人数；若加法方向法则混淆集中，回到三角形路径和平行四边形对角线；若减法错因集中，统一写出“减去一个向量等于加上它的相反向量”；若闭合路径或端点顺序错误集中，要求学生逐段标出起点和终点后订正。
    remediation_links:
      - content/applets/SH-HS-MATH-HJ-B2-C08-L02-A01
scoring:
  mastery_threshold: 0.75
  grading_mode: mixed
  retry_policy: 课堂内允许一次订正，保留首次错因标签。
