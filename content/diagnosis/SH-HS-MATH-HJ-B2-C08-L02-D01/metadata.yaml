    - 数学运算
    - 直观想象
  classroom_use: 课堂末尾 6 到 8 分钟即时诊断，也可作为作业讲评前的错因分流。
diagnosis_design:
  diagnostic_focus:
    - 只覆盖首尾相接、相反向量、闭合路径、端点顺序四类错因，用即时反馈提示方向来源；不做构造演示。
    - 能否暴露并解释：学生容易混淆三角形法则中的首尾相接和减法中的相反向量。
    - 能否暴露并解释：平行四边形法则常被当作画图模板，不能解释合向量的方向和大小。
    - 能否暴露并解释：从几何图形抽取向量等式时，路径方向和端点顺序容易出错。
  misconception_tags:
    - id: concept_expression_gap
      title: 概念表达不完整
      description: 学生能回忆局部结论，但不能写成完整、可推广的数学表达。
    - id: representation_mixup
      title: 表征混淆
      description: 学生在图像、符号或语言表征之间转换时混淆对象或条件。
