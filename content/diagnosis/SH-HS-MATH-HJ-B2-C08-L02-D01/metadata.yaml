  primary_teaching_problem: 学生容易混淆三角形法则中的首尾相接和减法中的相反向量。
  learning_goals:
    - 识别向量的加法和减法学习中的典型错因。
    - 用“比较”方式解释学生答案背后的数学理解偏差。
    - 根据错因标签选择课堂回讲或补救练习路径。
