version: "0.1.0"
status: "draft"
resource_type: "diagnosis"
title: "数量积正负误区诊断"
subtitle: "围绕夹角、投影、零向量边界和垂直判定的课堂即时诊断"
curriculum:
  region: "上海"
  stage: "高中"
  subject: "数学"
  edition: "沪教版"
  volume_id: "B2"
  volume_title: "必修第二册"
  chapter_id: "SH-HS-MATH-HJ-B2-C08"
  chapter_title: "平面向量"
  section_id: "SH-HS-MATH-HJ-B2-C08-S02"
  section_title: "向量的数量积"
  lesson_id: "SH-HS-MATH-HJ-B2-C08-L05"
  textbook_ref: "8.2.2"
  lesson_title: "向量的数量积的定义与运算律"
pedagogy:
  cognitive_action: "比较"
  estimated_classroom_minutes: 9
  primary_teaching_problem: "学生会背 a · b = |a||b|cosθ，却容易把数量积的符号、投影方向、垂直条件和零向量边界混在一起，甚至用长度大小替代夹角判断。"
  learning_goals:
    - "根据非零向量夹角的锐、直、钝及反向边界判断数量积的正、零、负。"
    - "用有向投影解释数量积符号，不把投影当作普通无符号线段长度。"
    - "区分 a · b = 0 的两类来源：零向量边界和两个非零向量垂直。"
    - "确认数量积的结果是数量，并能说明长度不变时夹角变化仍会改变数量积。"
  prerequisites:
    - "向量的大小、方向和夹角"
    - "向量的投影与有向投影长度"
    - "余弦在锐角、直角和钝角时的符号"
    - "零向量和垂直关系的基本约定"
  successors:
    - "SH-HS-MATH-HJ-B2-C08-L06"
    - "SH-HS-MATH-HJ-B2-C08-L09"
    - "SH-HS-MATH-HJ-B2-C08-L10"
  core_competencies:
    - "逻辑推理"
    - "数学运算"
    - "直观想象"
  classroom_use: "建议在数量积定义与运算律新授后 8 到 10 分钟完成；教师用错因标签决定是回到夹角分区、投影有向长度，还是补讲零向量边界。"
diagnosis_design:
  diagnostic_focus:
    - "能否用夹角锐、直、钝及 180° 反向边界判断两个非零向量数量积的符号。"
    - "能否用有向投影解释正负，而不是把投影长度一律看成正数。"
    - "能否正确表述 a · b = 0 与垂直的条件边界，尤其是不把零向量说成与任意向量夹角为 90°。"
    - "能否区分数量积的结果类型、方向信息和长度信息。"
    - "能否在不使用坐标公式的情况下，用定义和几何意义完成判断。"
  misconception_tags:
    - id: "angle_sign_confusion"
      title: "夹角符号误判"
      description: "不能稳定用锐角、直角、钝角判断 cosθ 和数量积的正、零、负。"
    - id: "projection_sign_confusion"
      title: "投影正负混淆"
      description: "把有向投影长度当成普通线段长度，忽略投影方向与基准向量方向相反时为负。"
    - id: "zero_vector_boundary"
      title: "零向量边界遗漏"
      description: "把 a · b = 0 直接说成两个向量垂直，未排除或单独说明零向量情况。"
    - id: "perpendicular_condition_overgeneralization"
      title: "垂直判定条件泛化"
      description: "使用 a · b = 0 判断垂直时没有补足两个向量均非零等必要条件。"
    - id: "result_type_scalar_confusion"
      title: "结果类型混淆"
      description: "把数量积误认为仍是向量，给它指定方向或端点。"
    - id: "length_direction_mixup"
      title: "长度与方向混淆"
      description: "只看 |a||b| 的大小，忽略夹角和方向决定数量积的符号与大小。"
  item_summary:
    total_items: 6
    question_types:
      - "draft_placeholder"
      - "single_choice"
      - "multiple_select"
      - "short_explanation"
      - "error_analysis"
    estimated_minutes: 9
  feedback_strategy:
    immediate_feedback: "每题反馈都回到一条几何理由：夹角分区、投影方向、零向量边界、结果是数量或长度与方向同时决定数量积。"
    teacher_dashboard_notes: "若 angle_sign_confusion 集中出现，先画锐角、直角、钝角三分区；若 projection_sign_confusion 集中出现，回到 L04 投影有向长度；若 zero_vector_boundary 或 perpendicular_condition_overgeneralization 集中出现，专门追问“两个向量是否都非零”；若 result_type_scalar_confusion 或 length_direction_mixup 集中出现，强调数量积不是向量且长度不能替代夹角。坐标公式留到 8.3 后续说明，不作为本诊断讲评主线。"
    remediation_links:
      - "content/applets/SH-HS-MATH-HJ-B2-C08-L04-A01"
      - "content/applets/SH-HS-MATH-HJ-B2-C08-L05-A01"
