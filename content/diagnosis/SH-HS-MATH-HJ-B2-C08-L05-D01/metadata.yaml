    - 数学运算
    - 直观想象
  classroom_use: 课堂末尾 6 到 8 分钟即时诊断，也可作为作业讲评前的错因分流。
diagnosis_design:
  diagnostic_focus:
    - 检测结果类型、垂直判定、零向量边界和运算律误用。
    - 能否暴露并解释：学生容易把数量积误认为仍是向量，忽略结果是数量。
    - 能否暴露并解释：数量积为零与某个向量为零、两个向量垂直之间的条件边界容易混淆。
    - 能否暴露并解释：运算律和几何意义之间脱节，导致代数变形缺少方向感。
  misconception_tags:
    - id: concept_expression_gap
      title: 概念表达不完整
      description: 学生能回忆局部结论，但不能写成完整、可推广的数学表达。
    - id: representation_mixup
      title: 表征混淆
      description: 学生在图像、符号或语言表征之间转换时混淆对象或条件。
