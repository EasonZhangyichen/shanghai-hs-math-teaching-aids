  primary_teaching_problem: 学生容易把数量积误认为仍是向量，忽略结果是数量。
  learning_goals:
    - 识别向量的数量积的定义与运算律学习中的典型错因。
    - 用“比较”方式解释学生答案背后的数学理解偏差。
    - 根据错因标签选择课堂回讲或补救练习路径。
  prerequisites:
    - 向量的数量积的定义与运算律相关先修知识
