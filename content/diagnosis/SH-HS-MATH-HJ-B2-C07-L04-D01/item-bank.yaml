schema_version: "0.1.0"
resource_id: "SH-HS-MATH-HJ-B2-C07-L04-D01"
title: "余弦性质误区诊断题组"
estimated_minutes: 8
total_score: 10
mastery_threshold: 0.75
misconception_tags:
  - "sine_transfer_error"
  - "period_omission"
  - "monotonic_interval_reversal"
  - "parity_symmetry_mixup"
  - "zero_extrema_formula_mixup"
  - "unit_circle_graph_gap"

items:
  - id: "D01-Q01"
    type: "single_choice"
    score: 1
    title: "奇偶性判断"
    diagnostic_focus: "能否判断余弦函数的偶函数性质。"
    prompt: "关于函数 y = cos x 的奇偶性，下列说法正确的是哪一项？"
    choices:
      - id: "A"
        text: "它是偶函数，因为 cos(-x) = cos x。"
        is_correct: true
        feedback: "单位圆上角 x 和 -x 的终边关于 x 轴对称，横坐标相同，所以余弦值相同。"
      - id: "B"
        text: "它是奇函数，因为正弦函数是奇函数。"
        is_correct: false
        misconception_tags: ["sine_transfer_error", "parity_symmetry_mixup"]
        feedback: "这里把正弦函数的性质迁移到了余弦函数；余弦满足 cos(-x) = cos x。"
      - id: "C"
        text: "它既不是奇函数也不是偶函数，因为图像不是关于原点对称。"
        is_correct: false
        misconception_tags: ["parity_symmetry_mixup"]
        feedback: "不是关于原点对称只能排除奇函数，还要检查是否关于 y 轴对称。"
      - id: "D"
        text: "它是奇函数，因为 cos 0 = 1。"
        is_correct: false
        misconception_tags: ["parity_symmetry_mixup", "unit_circle_graph_gap"]
        feedback: "奇函数若在 0 处有定义应满足 f(0) = 0；cos 0 = 1 反而说明它不可能是奇函数。"
    answer: ["A"]
    feedback_on_correct: "能把偶函数判断和单位圆横坐标解释连接起来。"

  - id: "D01-Q02"
    type: "single_choice"
    score: 1
    title: "最大值点横坐标"
    diagnostic_focus: "能否写出余弦函数最大值点的完整一般式。"
    prompt: "函数 y = cos x 取得最大值 1 的所有 x 可以写成哪一种形式？"
    choices:
      - id: "A"
        text: "x = 2kpi，k 属于整数"
        is_correct: true
        feedback: "余弦在每个 2pi 周期的起点取得最大值 1。"
      - id: "B"
        text: "x = 0"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "x = 0 是一个最大值点，但还要覆盖所有相隔 2pi 的点。"
      - id: "C"
        text: "x = pi/2 + 2kpi，k 属于整数"
        is_correct: false
        misconception_tags: ["sine_transfer_error", "zero_extrema_formula_mixup"]
        feedback: "这是正弦函数的最大值点形式；对余弦函数，这些点是零点。"
      - id: "D"
        text: "x = kpi，k 属于整数"
        is_correct: false
        misconception_tags: ["zero_extrema_formula_mixup"]
        feedback: "kpi 交替包含最大值点和最小值点，不能都作为最大值点。"
    answer: ["A"]
    feedback_on_correct: "能把余弦最大值点和正弦最大值点区分开，并写出周期。"

  - id: "D01-Q03"
    type: "single_choice"
    score: 2
    title: "递减区间"
    diagnostic_focus: "能否完整写出余弦函数的递减区间。"
    prompt: "下列哪一项能完整表达 y = cos x 的递减区间？"
    choices:
      - id: "A"
        text: "[2kpi, (2k + 1)pi]，k 属于整数"
        is_correct: true
        feedback: "余弦从最大值 1 下降到最小值 -1，这段每隔 2pi 重复。"
      - id: "B"
        text: "[0, pi]"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "这是一个递减区间，但没有写出所有周期中的递减区间。"
      - id: "C"
        text: "[-pi/2 + 2kpi, pi/2 + 2kpi]，k 属于整数"
        is_correct: false
        misconception_tags: ["sine_transfer_error", "monotonic_interval_reversal"]
        feedback: "这段包含 x = 2kpi 附近的最大值点，先增后减，不是一个递减区间。"
      - id: "D"
        text: "[(2k - 1)pi, 2kpi]，k 属于整数"
        is_correct: false
        misconception_tags: ["monotonic_interval_reversal"]
        feedback: "这段从最小值 -1 走向最大值 1，是递增区间。"
    answer: ["A"]
    feedback_on_correct: "能用端点和周期同时描述余弦的递减半周期。"

  - id: "D01-Q04"
    type: "multiple_select"
    score: 2
    title: "对称轴与对称中心"
    diagnostic_focus: "能否区分余弦图像的轴对称和中心对称。"
    prompt: "关于 y = cos x 的对称性，下列说法正确的是哪些？"
    choices:
      - id: "A"
        text: "y = cos x 关于 y 轴对称。"
        is_correct: true
        feedback: "余弦是偶函数，图像关于 y 轴对称。"
      - id: "B"
        text: "x = kpi，k 属于整数，是余弦图像的对称轴。"
        is_correct: true
        feedback: "最大值点和最小值点所在的竖直直线都是余弦图像的对称轴。"
      - id: "C"
        text: "(pi/2 + kpi, 0)，k 属于整数，是余弦图像的对称中心。"
        is_correct: true
        feedback: "余弦图像在每个零点处具有中心对称。"
      - id: "D"
        text: "(kpi, 0)，k 属于整数，是余弦图像的对称中心。"
        is_correct: false
        misconception_tags: ["parity_symmetry_mixup", "zero_extrema_formula_mixup"]
        feedback: "x = kpi 对应最大值点或最小值点所在的对称轴，不是中心对称点。"
    answer: ["A", "B", "C"]
    scoring_note: "全选且不多选得 2 分；漏选一个正确项得 1 分；选择 D 时记录 parity_symmetry_mixup。"
    feedback_on_correct: "能把偶函数、竖直对称轴和中心对称点分层处理。"

  - id: "D01-Q05"
    type: "short_explanation"
    score: 2
    title: "局部观察与单调区间"
    diagnostic_focus: "能否解释为什么套用正弦递增区间会出错。"
    prompt: "有同学说：因为 cos(-pi/2) = 0，cos 0 = 1，cos(pi/2) = 0，所以 y = cos x 在 [-pi/2, pi/2] 上是递增的。请判断这句话是否正确，并说明理由。"
    expected_response:
      - "这句话不正确。"
      - "在 [-pi/2, 0] 上函数值增加，在 [0, pi/2] 上函数值减少。"
      - "x = 0 是最大值点，区间内出现转折点，不能把整段看作递增区间。"
      - "余弦函数的递增区间可写作 [(2k - 1)pi, 2kpi]，k 属于整数；递减区间可写作 [2kpi, (2k + 1)pi]，k 属于整数。"
    misconception_tags_when_incomplete:
      - "sine_transfer_error"
      - "monotonic_interval_reversal"
      - "period_omission"
    feedback_on_correct: "能用端点和转折点解释单调性，而不是只套用正弦函数区间。"

  - id: "D01-Q06"
    type: "error_analysis"
    score: 2
    title: "综合错因订正"
    diagnostic_focus: "能否同时订正奇偶性、关键点和单调区间。"
    prompt: "某学生写道：y = cos x 是奇函数；最大值点横坐标是 x = pi/2 + 2kpi；零点是 x = 0, pi；递减区间是 [-pi/2 + 2kpi, pi/2 + 2kpi]。请指出至少两处错误并改正。"
    expected_response:
      - "y = cos x 是偶函数，因为 cos(-x) = cos x。"
      - "最大值点横坐标应为 x = 2kpi，k 属于整数。"
      - "零点应为 x = pi/2 + kpi，k 属于整数。"
      - "递减区间应为 [2kpi, (2k + 1)pi]，k 属于整数。"
      - "[-pi/2 + 2kpi, pi/2 + 2kpi] 中间经过最大值点，不是单调递减区间。"
    misconception_tags_when_incomplete:
      - "sine_transfer_error"
      - "period_omission"
      - "monotonic_interval_reversal"
      - "parity_symmetry_mixup"
      - "zero_extrema_formula_mixup"
    feedback_on_correct: "能从一个错误答案中分辨正弦迁移、周期遗漏、关键点混用和单调区间错误。"
