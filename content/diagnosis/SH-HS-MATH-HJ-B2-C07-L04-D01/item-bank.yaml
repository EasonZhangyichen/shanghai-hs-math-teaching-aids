schema_version: "0.1.0"
resource_id: "SH-HS-MATH-HJ-B2-C07-L04-D01"
title: "余弦性质误区诊断题组"
estimated_minutes: 8
total_score: 10
mastery_threshold: 0.75
misconception_tags:
  - "sine_transfer_error"
  - "period_omission"
  - "period_length_confusion"
  - "monotonic_interval_reversal"
  - "axis_center_mixup"
  - "zero_extrema_formula_mixup"
  - "unit_circle_graph_gap"

items:
  - id: "D01-Q01"
    type: "multiple_select"
    score: 1
    title: "基础性质与零点"
    diagnostic_focus: "能否同时确认定义域、值域、周期、偶函数和零点一般式。"
    prompt: "关于函数 y = cos x 的基础性质和零点，下列说法正确的是哪些？"
    choices:
      - id: "A"
        text: "定义域是 R，值域是 [-1, 1]。"
        is_correct: true
        feedback: "余弦函数对任意实数 x 都有定义，函数值始终在 -1 和 1 之间。"
      - id: "B"
        text: "最小正周期是 2π，并且 y = cos x 是偶函数。"
        is_correct: true
        feedback: "cos(x + 2π) = cos x，且 cos(-x) = cos x。"
      - id: "C"
        text: "全部零点可以写作 x = π/2 + kπ，k ∈ Z。"
        is_correct: true
        feedback: "这些点对应单位圆横坐标为 0，也就是余弦图像与 x 轴的所有交点。"
      - id: "D"
        text: "相邻两个零点间隔 π，所以最小正周期是 π。"
        is_correct: false
        misconception_tags: ["period_length_confusion"]
        feedback: "零点间隔 π 不等于函数周期；整体图像重复需要平移 2π。"
    answer: ["A", "B", "C"]
    scoring_note: "全选 A、B、C 且不选 D 得 1 分；选择 D 时记录 period_length_confusion。"
    feedback_on_correct: "能把定义域、值域、周期、偶函数和零点一般式放在同一张性质表中判断。"

  - id: "D01-Q02"
    type: "single_choice"
    score: 1
    title: "最值点横坐标"
    diagnostic_focus: "能否区分最大值点、最小值点和只写特殊值。"
    prompt: "函数 y = cos x 的最大值点和最小值点横坐标应如何完整表达？"
    choices:
      - id: "A"
        text: "最大值 1：x = 2kπ；最小值 -1：x = (2k + 1)π，k ∈ Z"
        is_correct: true
        feedback: "最大值点和最小值点都每隔 2π 重复一次，且两类点不能混用。"
      - id: "B"
        text: "最大值 1：x = 0；最小值 -1：x = π"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "这里只写出一个周期中的最值点，遗漏了所有 2π 平移后的点。"
      - id: "C"
        text: "最大值 1：x = π/2 + 2kπ；最小值 -1：x = -π/2 + 2kπ，k ∈ Z"
        is_correct: false
        misconception_tags: ["sine_transfer_error", "zero_extrema_formula_mixup"]
        feedback: "这是正弦函数的最值点形式；对余弦函数，这些点都是零点。"
      - id: "D"
        text: "最大值和最小值都出现在 x = kπ，k ∈ Z"
        is_correct: false
        misconception_tags: ["zero_extrema_formula_mixup"]
        feedback: "x = kπ，k ∈ Z 交替包含最大值点和最小值点，不能说明哪一类点取最大值或最小值。"
    answer: ["A"]
    feedback_on_correct: "最大值点、最小值点与零点已经分开表达。"

  - id: "D01-Q03"
    type: "single_choice"
    score: 2
    title: "递减区间"
    diagnostic_focus: "能否完整写出余弦函数的递减区间。"
    prompt: "下列哪一项能完整表达 y = cos x 的递减区间？"
    choices:
      - id: "A"
        text: "[2kπ, (2k + 1)π]，k ∈ Z"
        is_correct: true
        feedback: "余弦从最大值 1 下降到最小值 -1，这段每隔 2π 重复。"
      - id: "B"
        text: "[0, π]"
        is_correct: false
        misconception_tags: ["period_omission"]
        feedback: "这是一个递减区间，但没有写出所有周期中的递减区间。"
      - id: "C"
        text: "[-π/2 + 2kπ, π/2 + 2kπ]，k ∈ Z"
        is_correct: false
        misconception_tags: ["sine_transfer_error", "monotonic_interval_reversal"]
        feedback: "这段包含 x = 2kπ 附近的最大值点，先增后减，不是一个递减区间。"
      - id: "D"
        text: "[(2k - 1)π, 2kπ]，k ∈ Z"
        is_correct: false
        misconception_tags: ["monotonic_interval_reversal"]
        feedback: "这段从最小值 -1 走向最大值 1，是递增区间。"
    answer: ["A"]
    feedback_on_correct: "能用端点和周期同时描述余弦的递减半周期。"

  - id: "D01-Q04"
    type: "multiple_select"
    score: 2
    title: "对称轴与对称中心"
    diagnostic_focus: "能否区分余弦图像的轴对称和中心对称。"
    prompt: "关于 y = cos x 的对称性，下列说法正确的是哪些？"
    choices:
      - id: "A"
        text: "y = cos x 关于 y 轴对称。"
        is_correct: true
        feedback: "余弦是偶函数，图像关于 y 轴对称。"
      - id: "B"
        text: "x = kπ，k ∈ Z，是余弦图像的对称轴。"
        is_correct: true
        feedback: "最大值点和最小值点所在的竖直直线都是余弦图像的对称轴。"
      - id: "C"
        text: "(π/2 + kπ, 0)，k ∈ Z，是余弦图像的对称中心。"
        is_correct: true
        feedback: "余弦图像在每个零点处具有中心对称。"
      - id: "D"
        text: "(kπ, 0)，k ∈ Z，是余弦图像的对称中心。"
        is_correct: false
        misconception_tags: ["axis_center_mixup", "zero_extrema_formula_mixup"]
        feedback: "x = kπ 对应最大值点或最小值点所在的对称轴，不是中心对称点。"
    answer: ["A", "B", "C"]
    scoring_note: "全选且不多选得 2 分；漏选一个正确项得 1 分；选择 D 时记录 axis_center_mixup。"
    feedback_on_correct: "能把偶函数、竖直对称轴和中心对称点分层处理。"

  - id: "D01-Q05"
    type: "short_explanation"
    score: 2
    title: "局部观察与单调区间"
    diagnostic_focus: "能否解释为什么套用正弦递增区间会出错。"
    prompt: "有同学说：因为 cos(-π/2) = 0，cos 0 = 1，cos(π/2) = 0，所以 y = cos x 在 [-π/2, π/2] 上是递增的。请判断这句话是否正确，并说明理由。"
    expected_response:
      - "这句话不正确。"
      - "在 [-π/2, 0] 上函数值增加，在 [0, π/2] 上函数值减少。"
      - "从单位圆看，终边从 -π/2 转到 0 时横坐标增大，从 0 转到 π/2 时横坐标减小。"
      - "x = 0 是最大值点，区间内出现转折点，不能把整段看作递增区间。"
      - "余弦函数的递增区间可写作 [(2k - 1)π, 2kπ]，k ∈ Z；递减区间可写作 [2kπ, (2k + 1)π]，k ∈ Z。"
    misconception_tags_when_incomplete:
      - "sine_transfer_error"
      - "monotonic_interval_reversal"
      - "period_omission"
      - "unit_circle_graph_gap"
    feedback_on_correct: "能用端点和转折点解释单调性，而不是只套用正弦函数区间。"

  - id: "D01-Q06"
    type: "error_analysis"
    score: 2
    title: "综合错因订正"
    diagnostic_focus: "能否同时订正奇偶性、周期长度、关键点和单调区间。"
    prompt: "某学生写道：y = cos x 是奇函数；最小正周期是 π；最大值点横坐标是 x = π/2 + 2kπ；零点是 x = 0, π；递减区间是 [-π/2 + 2kπ, π/2 + 2kπ]。请指出至少两处错误并改正。"
    expected_response:
      - "y = cos x 是偶函数，因为 cos(-x) = cos x。"
      - "最小正周期应为 2π，不是 π。"
      - "最大值点横坐标应为 x = 2kπ，k ∈ Z。"
      - "零点应为 x = π/2 + kπ，k ∈ Z。"
      - "递减区间应为 [2kπ, (2k + 1)π]，k ∈ Z。"
      - "[-π/2 + 2kπ, π/2 + 2kπ] 中间经过最大值点，不是单调递减区间。"
    misconception_tags_when_incomplete:
      - "sine_transfer_error"
      - "period_omission"
      - "period_length_confusion"
      - "monotonic_interval_reversal"
      - "zero_extrema_formula_mixup"
    feedback_on_correct: "能从一个错误答案中分辨正弦迁移、周期长度误判、周期遗漏、关键点混用和单调区间错误。"
