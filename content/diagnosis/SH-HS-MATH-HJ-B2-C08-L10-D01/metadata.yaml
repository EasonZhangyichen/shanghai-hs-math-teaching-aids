  classroom_use: 课堂末尾 6 到 8 分钟即时诊断，也可作为作业讲评前的错因分流。
diagnosis_design:
  diagnostic_focus:
    - 围绕几何条件选择基底法、坐标法或数量积法的第一步理由给反馈，不批改完整证明过程。
    - 能否暴露并解释：学生面对几何题时不知道先选基底、建坐标还是使用数量积。
    - 能否暴露并解释：几何语言转化为向量等式的第一步难，容易直接套公式。
    - 能否暴露并解释：证明过程中的向量路径、辅助点和坐标系选择缺少策略。
  misconception_tags:
